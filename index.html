<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pomodo — Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="grain"></div>
    </div>

    <main class="app">
      <header class="brand">
        <p class="brand-mark">Pomodo</p>
        <p class="brand-tag" id="status-copy">Twenty-five minutes of deep focus.</p>
      </header>

      <section class="timer" aria-labelledby="mode-label">
        <p class="mode" id="mode-label">Focus</p>

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 280 280" aria-hidden="true">
            <circle class="ring-track" cx="140" cy="140" r="120" />
            <circle class="ring-progress" cx="140" cy="140" r="120" />
          </svg>
          <div class="time-block">
            <p class="time" id="time" aria-live="polite">25:00</p>
            <p class="session" id="session">Session 1</p>
            <p class="focus-now" id="focus-now" hidden></p>
          </div>
        </div>

        <div class="adjust" role="group" aria-label="Adjust timer length">
          <button type="button" class="btn btn-adjust btn-minus" id="minus-five">
            −5 min
          </button>
          <button type="button" class="btn btn-adjust btn-plus" id="plus-five">
            +5 min
          </button>
        </div>

        <div class="controls">
          <button type="button" class="btn btn-primary" id="toggle" aria-pressed="false">
            Start
          </button>
          <button type="button" class="btn btn-ghost" id="reset">Reset</button>
        </div>

        <div class="modes" role="tablist" aria-label="Timer mode">
          <button type="button" class="mode-btn is-active" data-mode="focus" role="tab" aria-selected="true">
            Focus
          </button>
          <button type="button" class="mode-btn" data-mode="short" role="tab" aria-selected="false">
            Short break
          </button>
          <button type="button" class="mode-btn" data-mode="long" role="tab" aria-selected="false">
            Long break
          </button>
        </div>
      </section>

      <section class="log" aria-labelledby="log-title">
        <h2 class="log-title" id="log-title">Focus log</h2>
        <div class="log-range" role="tablist" aria-label="Log range">
          <button type="button" class="log-range-btn is-active" data-range="daily" role="tab" aria-selected="true">
            Daily
          </button>
          <button type="button" class="log-range-btn" data-range="weekly" role="tab" aria-selected="false">
            Weekly
          </button>
          <button type="button" class="log-range-btn" data-range="monthly" role="tab" aria-selected="false">
            Monthly
          </button>
          <button type="button" class="log-range-btn" data-range="all" role="tab" aria-selected="false">
            Up to now
          </button>
        </div>
        <p class="log-summary" id="log-summary"></p>
        <div class="log-categories" id="log-categories"></div>
        <ul class="log-sessions" id="log-sessions"></ul>
      </section>
    </main>

    <div class="reward" id="intent" hidden>
      <form class="reward-card intent-card" id="intent-form" role="dialog" aria-modal="true" aria-labelledby="intent-kicker">
        <p class="reward-kicker" id="intent-kicker">This focus block</p>
        <p class="intent-lead">What’s the goal of this Pomodoro?</p>

        <label class="field">
          <span>Goal</span>
          <input
            id="intent-focus"
            type="text"
            maxlength="80"
            placeholder="e.g. Cut the next YouTube intro"
            required
          />
        </label>

        <div class="field">
          <span>Categories</span>
          <div class="chips" id="intent-chips"></div>
          <div class="add-category">
            <input id="intent-new-category" type="text" maxlength="40" placeholder="Add a new category" />
            <button type="button" class="btn btn-ghost" id="intent-add-category">Add</button>
          </div>
          <p class="field-hint" id="intent-category-error" hidden>Pick at least one category.</p>
        </div>

        <div class="intent-actions">
          <button type="button" class="btn btn-ghost" id="intent-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Start</button>
        </div>
      </form>
    </div>

    <div class="reward" id="reward" hidden>
      <div class="reward-card" role="dialog" aria-modal="true" aria-labelledby="reward-kicker">
        <p class="reward-kicker" id="reward-kicker">Session complete</p>
        <div class="reward-body" id="reward-body"></div>
        <button type="button" class="btn btn-primary" id="reward-close">Nice</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
